<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LQK Kids Admin - Chỉnh Sửa Nội Dung Website & Kênh Mua Hàng</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..700,0..1,0" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-900 text-slate-100 overflow-x-hidden">

  <!-- Top Admin Bar -->
  <header class="h-16 bg-slate-800/90 backdrop-blur-md border-b border-slate-700/60 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center transition-colors">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </a>
      <div>
        <h1 class="text-sm font-extrabold text-white tracking-tight leading-none">QUẢN LÝ NỘI DUNG & LIÊN KẾT KÊNH MUA HÀNG</h1>
        <span class="text-[11px] text-slate-400">LQK Kids Admin Workspace</span>
      </div>
    </div>
  </header>

  <!-- Content Workspace -->
  <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">
    <form id="content-form" class="flex flex-col gap-6">
      
      <!-- Social & Channel Links Section -->
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 flex flex-col gap-4 shadow-md">
        <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2 border-b border-slate-700/60 pb-3">
          <span class="material-symbols-outlined text-[18px]">link</span>
          Cấu Hình Liên Kết Các Kênh Mua Hàng & Mạng Xã Hội
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">🎵 Đường dẫn TikTok Shop / Profile</label>
            <input type="url" id="link-tiktok" placeholder="https://www.tiktok.com/@LQKKIDS" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">🛒 Đường dẫn Shopee Mall / Shop</label>
            <input type="url" id="link-shopee" placeholder="https://shopee.vn/LQKKids" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">📘 Đường dẫn Facebook Fanpage</label>
            <input type="url" id="link-facebook" placeholder="https://facebook.com/LQKKids" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">👥 Đường dẫn Facebook Group</label>
            <input type="url" id="link-facebook-group" placeholder="https://facebook.com/groups/LQKKidsCommunity" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">💬 Đường dẫn Zalo Chat Official</label>
          <input type="url" id="link-zalo" placeholder="https://zalo.me/0934498685" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>
      </div>

      <!-- Contact Info Section -->
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 flex flex-col gap-4 shadow-md">
        <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2 border-b border-slate-700/60 pb-3">
          <span class="material-symbols-outlined text-[18px]">contact_phone</span>
          Thông Tin Liên Hệ & Hotline
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">SĐT Hotline 1 (Chính)</label>
            <input type="text" id="phone-1" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">SĐT Hotline 2 (Phụ)</label>
            <input type="text" id="phone-2" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Địa Chỉ Shop Trực Tiếp</label>
          <input type="text" id="site-address" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>
      </div>

      <!-- Hero Banner Section -->
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 flex flex-col gap-4 shadow-md">
        <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2 border-b border-slate-700/60 pb-3">
          <span class="material-symbols-outlined text-[18px]">view_carousel</span>
          Khu Vực Hero Banner Đầu Trang
        </h2>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Headline Chính</label>
          <input type="text" id="hero-headline" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Subheadline Phụ</label>
          <input type="text" id="hero-subheadline" class="w-full h-10 px-3.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Đoạn Giới Thiệu Ngắn</label>
          <textarea id="hero-description" rows="3" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <a href="index.html" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition-colors">
          Hủy Bỏ
        </a>
        <button type="submit" class="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs shadow-lg active:scale-95 transition-all flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">save</span>
          <span>LƯU NỘI DUNG & LINK CẤU HÌNH</span>
        </button>
      </div>

    </form>
  </main>

  <script type="module">
    import { getAdminContent, saveAdminContent, requireAdminAuth } from './admin-store.js';

    let contentData = {};

    document.addEventListener('DOMContentLoaded', async () => {
      requireAdminAuth();

      contentData = await getAdminContent();
      populateForm(contentData);

      document.getElementById('content-form').addEventListener('submit', handleFormSubmit);
    });

    function populateForm(data) {
      if (data.site) {
        document.getElementById('phone-1').value = data.site.phonePrimary || '';
        document.getElementById('phone-2').value = data.site.phoneSecondary || '';
        document.getElementById('site-address').value = data.site.address || '';
        document.getElementById('link-tiktok').value = data.site.tiktokUrl || '';
        document.getElementById('link-shopee').value = data.site.shopeeUrl || '';
        document.getElementById('link-facebook').value = data.site.facebookUrl || '';
        document.getElementById('link-facebook-group').value = data.site.facebookGroupUrl || '';
        document.getElementById('link-zalo').value = data.site.zaloUrl || '';
      }

      if (data.hero) {
        document.getElementById('hero-headline').value = data.hero.headline || '';
        document.getElementById('hero-subheadline').value = data.hero.subheadline || '';
        document.getElementById('hero-description').value = data.hero.description || '';
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      if (!contentData.site) contentData.site = {};
      if (!contentData.hero) contentData.hero = {};

      contentData.site.phonePrimary = document.getElementById('phone-1').value.trim();
      contentData.site.phoneSecondary = document.getElementById('phone-2').value.trim();
      contentData.site.address = document.getElementById('site-address').value.trim();

      const tiktok = document.getElementById('link-tiktok').value.trim();
      const shopee = document.getElementById('link-shopee').value.trim();
      const fb = document.getElementById('link-facebook').value.trim();
      const fbGrp = document.getElementById('link-facebook-group').value.trim();
      const zalo = document.getElementById('link-zalo').value.trim();

      contentData.site.tiktokUrl = tiktok;
      contentData.site.shopeeUrl = shopee;
      contentData.site.facebookUrl = fb;
      contentData.site.facebookGroupUrl = fbGrp;
      contentData.site.zaloUrl = zalo;

      contentData.hero.headline = document.getElementById('hero-headline').value.trim();
      contentData.hero.subheadline = document.getElementById('hero-subheadline').value.trim();
      contentData.hero.description = document.getElementById('hero-description').value.trim();

      saveAdminContent(contentData);
      alert('Đã cập nhật cấu hình liên kết & nội dung website!');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
