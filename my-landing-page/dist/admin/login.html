<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LQK Kids Admin - Đăng Nhập Hệ Thống</title>

  <!-- Favicon Icons -->
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="shortcut icon" href="../favicon.ico" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..700,0..1,0" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" crossorigin src="/assets/adminLogin-CNP-35E9.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-store-DQNuBvK0.js">
</head>
<body class="h-full flex items-center justify-center font-sans antialiased bg-slate-900 text-slate-100 p-4">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center">
    
    <!-- LQK Kids Official Logo -->
    <div class="w-24 h-24 mb-4 rounded-2xl p-2 bg-slate-900 border border-slate-700 shadow-md flex items-center justify-center">
      <img src="/assets/logo-COUygXoP.png" alt="LQK Kids Logo" class="w-full h-full object-contain" />
    </div>

    <h1 class="text-xl font-extrabold text-white tracking-tight">LQK KIDS ADMIN</h1>
    <p class="text-xs text-slate-400 mt-1 mb-6 text-center">Hệ Thống Quản Lý Nội Dung & Sản Phẩm Website</p>

    <!-- Error Alert -->
    <div id="login-error" class="hidden w-full p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold mb-4 text-center">
      Tên đăng nhập hoặc mật khẩu không chính xác!
    </div>

    <!-- Login Form -->
    <form id="login-form" class="w-full flex flex-col gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Tên đăng nhập</label>
        <div class="relative">
          <span class="material-symbols-outlined text-[18px] text-slate-400 absolute left-3.5 top-2.5">person</span>
          <input type="text" id="username" required placeholder="Nhập tên đăng nhập" class="w-full h-10 pl-10 pr-4 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Mật khẩu</label>
        <div class="relative">
          <span class="material-symbols-outlined text-[18px] text-slate-400 absolute left-3.5 top-2.5">lock</span>
          <input type="password" id="password" required placeholder="Nhập mật khẩu" class="w-full h-10 pl-10 pr-4 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>
      </div>

      <button type="submit" class="w-full h-11 mt-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">login</span>
        <span>ĐĂNG NHẬP XÁC THỰC</span>
      </button>
    </form>

  </div>

</body>
</html>
