<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LQK Kids Admin - Quản Lý Sản Phẩm</title>

  <!-- Favicon Icons -->
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="shortcut icon" href="../favicon.ico" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..700,0..1,0" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" crossorigin src="/assets/admin-BQwjMAeT.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-store-DyXd5tTt.js">
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-900 text-slate-100 overflow-x-hidden">

  <!-- Top Admin Bar -->
  <header class="h-16 bg-slate-800/90 backdrop-blur-md border-b border-slate-700/60 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-900 border border-slate-700 p-0.5 shrink-0">
        <img src="/assets/logo-COUygXoP.png" alt="LQK Kids Logo" class="w-full h-full object-contain" />
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-white tracking-tight leading-none">LQK KIDS ADMIN</h1>
        <span class="text-[11px] text-slate-400">Quản Lý Sản Phẩm</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="change-pass-btn" class="px-3 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs font-semibold flex items-center gap-1 transition-colors border border-amber-500/20">
        <span class="material-symbols-outlined text-[16px]">key</span>
        <span class="hidden sm:inline">Đổi mật khẩu</span>
      </button>
      <a href="../index.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition-colors border border-slate-600/50">
        <span class="material-symbols-outlined text-[16px]">open_in_new</span>
        <span class="hidden sm:inline">Xem Website</span>
      </a>
      <button id="admin-logout-btn" class="px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold flex items-center gap-1 transition-colors border border-red-500/20">
        <span class="material-symbols-outlined text-[16px]">logout</span>
        <span class="hidden sm:inline">Đăng xuất</span>
      </button>
    </div>
  </header>

  <!-- Sidebar & Main Content Split Layout -->
  <div class="flex-1 flex flex-col md:flex-row">
    
    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-64 bg-slate-800/40 border-b md:border-b-0 md:border-r border-slate-700/60 p-3 sm:p-4 shrink-0">
      <nav class="flex md:flex-col gap-2 overflow-x-auto no-scrollbar pb-1 md:pb-0">
        <a href="index.html" class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs shadow-md transition-all whitespace-nowrap shrink-0">
          <span class="material-symbols-outlined text-[18px]">inventory_2</span>
          <span>Sản Phẩm</span>
        </a>
        <a href="edit-product.html" class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white font-semibold text-xs transition-all whitespace-nowrap shrink-0">
          <span class="material-symbols-outlined text-[18px]">add_circle</span>
          <span>Thêm Sản Phẩm</span>
        </a>
        <a href="content.html" class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white font-semibold text-xs transition-all whitespace-nowrap shrink-0">
          <span class="material-symbols-outlined text-[18px]">edit_note</span>
          <span>Landing Page Edit</span>
        </a>
      </nav>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 flex flex-col gap-6 max-w-7xl">
      
      <!-- Top Action Bar -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-800/60 p-4 sm:p-5 rounded-2xl border border-slate-700/50">
        <div>
          <h2 id="total-count-heading" class="text-lg font-bold text-white">Danh Sách Sản Phẩm</h2>
          <p class="text-xs text-slate-400 mt-0.5">Quản lý, chỉnh sửa giá, tên, hình ảnh và thuộc tính sản phẩm trên website LQK Kids</p>
        </div>

        <a href="edit-product.html" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold flex items-center gap-2 shadow-md active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[18px]">add</span>
          <span>Thêm Sản Phẩm Mới</span>
        </a>
      </div>

      <!-- Search & Category Filters -->
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <span class="material-symbols-outlined text-[20px] text-slate-400 absolute left-3 top-2.5">search</span>
          <input id="search-input" type="text" placeholder="Tìm kiếm theo tên hoặc mã SP..." class="w-full h-10 pl-10 pr-4 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <select id="category-filter" class="h-10 px-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="all">Tất cả danh mục</option>
          <option value="set">Set Đồ</option>
          <option value="be-trai">Bé Trai</option>
          <option value="be-gai">Bé Gái</option>
          <option value="phu-kien">Phụ Kiện</option>
        </select>
      </div>

      <!-- Products Grid -->
      <div id="admin-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <!-- Rendered by JavaScript -->
      </div>
    </main>
  </div>

</body>
</html>
